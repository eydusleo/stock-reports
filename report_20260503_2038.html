<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>持仓深度分析 | </title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', 'PingFang SC', sans-serif;
    background: #FAF8F5;
    color: #2D2D2D;
    line-height: 1.6;
    padding: 24px;
    max-width: 1200px;
    margin: 0 auto;
}
.report-header {
    background: #FFFFFF;
    border: 1px solid #E8E4DF;
    border-radius: 16px;
    padding: 32px;
    margin-bottom: 32px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}
.report-title {
    font-size: 28px;
    font-weight: 700;
    color: #1A1A1A;
    margin-bottom: 8px;
}
.report-meta {
    color: #7A7A7A;
    font-size: 14px;
}
.summary-cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-top: 24px;
}
.summary-card {
    background: #F5F2EE;
    border-radius: 12px;
    padding: 20px;
    border: 1px solid #E8E4DF;
}
.summary-card .label { color: #7A7A7A; font-size: 13px; margin-bottom: 4px; }
.summary-card .value { font-size: 24px; font-weight: 700; color: #1A1A1A; }
.section-title {
    font-size: 20px;
    font-weight: 600;
    color: #1A1A1A;
    margin: 32px 0 16px;
    padding-left: 12px;
    border-left: 3px solid #6366F1;
}
.section-title.urgent { border-left-color: #DC2626; }
.section-title.watch { border-left-color: #D97706; }
.section-title.safe { border-left-color: #16A34A; }

.stock-card {
    background: #FFFFFF;
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 24px;
    border: 1px solid #E8E4DF;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 1px 4px rgba(0,0,0,0.03);
}
.stock-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.08);
}
.stock-card.urgent { border-left: 3px solid #DC2626; }
.stock-card.watch { border-left: 3px solid #D97706; }
.stock-card.safe { border-left: 3px solid #16A34A; }

.card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}
.stock-symbol { font-size: 22px; font-weight: 700; color: #1A1A1A; }
.stock-name { font-size: 14px; color: #7A7A7A; margin-left: 10px; }
.stock-badge {
    background: #EEF2FF;
    color: #4F46E5;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 13px;
}
.metrics-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 20px;
}
@media (max-width: 768px) {
    .metrics-grid { grid-template-columns: repeat(2, 1fr); }
    .deep-analysis-grid { grid-template-columns: 1fr !important; }
    .argument-section { flex-direction: column !important; }
}
.metric {
    background: #F9F7F4;
    border-radius: 8px;
    padding: 12px;
    text-align: center;
    border: 1px solid #EDE9E4;
}
.metric-label { display: block; font-size: 12px; color: #7A7A7A; margin-bottom: 4px; }
.metric-value { display: block; font-size: 16px; font-weight: 600; color: #1A1A1A; }

.section-block { margin-bottom: 16px; }
.section-block h4 {
    font-size: 14px;
    font-weight: 600;
    color: #4F46E5;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}
.trend-text { color: #4A4A4A; font-size: 14px; line-height: 1.7; }

.data-table, .strategy-table, .risk-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
}
.data-table td, .strategy-table td, .strategy-table th, .risk-table td {
    padding: 8px 12px;
    border-bottom: 1px solid #EDE9E4;
}
.strategy-table th {
    text-align: left;
    color: #7A7A7A;
    font-weight: 500;
    font-size: 12px;
}
.price-cell { color: #B45309; font-weight: 600; }
.risk-label { color: #DC2626; font-weight: 500; white-space: nowrap; }

.news-list { list-style: none; }
.news-item {
    padding: 6px 0;
    border-bottom: 1px solid #F0EDE9;
    font-size: 13px;
    color: #4A4A4A;
}
.news-item::before { content: "• "; color: #4F46E5; }

/* ===== v2 深度分析区块 ===== */

.deep-analysis-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 20px;
}
.deep-block {
    background: #F9F7F4;
    border-radius: 10px;
    padding: 16px;
    border: 1px solid #EDE9E4;
}
.deep-block-title {
    font-size: 13px;
    font-weight: 600;
    color: #4F46E5;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
}
.deep-icon { font-size: 15px; }

/* 筹码分布 */
.chip-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}
.chip-metric {
    display: flex;
    flex-direction: column;
    padding: 8px;
    background: #FFFFFF;
    border-radius: 6px;
    border: 1px solid #EDE9E4;
}
.chip-metric.main-chip {
    grid-column: span 2;
    text-align: center;
    background: #EEF2FF;
    border: 1px solid #C7D2FE;
}
.chip-label { font-size: 11px; color: #7A7A7A; margin-bottom: 2px; }
.chip-value { font-size: 16px; font-weight: 700; color: #1A1A1A; }
.chip-value.small-val { font-size: 13px; font-weight: 500; }

/* K线关键位 */
.deep-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
}
.deep-table th {
    text-align: left;
    color: #7A7A7A;
    font-weight: 500;
    font-size: 11px;
    padding: 4px 8px;
    border-bottom: 1px solid #E8E4DF;
}
.deep-table td {
    padding: 5px 8px;
    border-bottom: 1px solid #F0EDE9;
    color: #4A4A4A;
}
.kline-period { color: #7A7A7A; white-space: nowrap; font-size: 11px; }
.compact-table td:first-child {
    color: #7A7A7A;
    font-size: 12px;
    width: 40%;
    white-space: nowrap;
}

/* 资金流向 */
.fund-desc {
    font-size: 12px;
    color: #4A4A4A;
    margin-bottom: 8px;
    line-height: 1.5;
}
.fund-item { color: #7A7A7A; }
.fund-in { color: #16A34A; font-weight: 600; }
.fund-out { color: #DC2626; font-weight: 600; }

/* ===== 正反论证区块 ===== */
.argument-section {
    display: flex;
    gap: 16px;
    margin-bottom: 20px;
}
.argument-col {
    flex: 1;
    border-radius: 10px;
    padding: 16px;
}
.bull-col {
    background: #F0FDF4;
    border: 1px solid #BBF7D0;
}
.bear-col {
    background: #FEF2F2;
    border: 1px solid #FECACA;
}
.argument-title {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid #E8E4DF;
}
.bull-title { color: #16A34A; }
.bear-title { color: #DC2626; }
.argument-list {
    list-style: none;
    margin: 0;
    padding: 0;
}
.argument-list li {
    padding: 5px 0;
    font-size: 13px;
    line-height: 1.6;
    color: #4A4A4A;
    border-bottom: 1px solid #F0EDE9;
}
.bull-reason::before { content: "✅ "; }
.bear-reason::before { content: "⚠️ "; }

/* ===== 一句话裁决 ===== */
.verdict-line {
    background: #EEF2FF;
    border-radius: 10px;
    padding: 14px 18px;
    margin-top: 16px;
    border: 1px solid #C7D2FE;
    position: relative;
}
.verdict-line::before {
    content: "💡";
    position: absolute;
    left: 18px;
    top: 14px;
    font-size: 16px;
}
.verdict-line p {
    color: #1E1B4B;
    font-size: 14px;
    font-weight: 600;
    padding-left: 28px;
    line-height: 1.6;
}

.changes-section, .actions-section {
    background: #FFFFFF;
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 20px;
    border: 1px solid #E8E4DF;
}
.changes-section ul, .actions-section ul { list-style: none; }
.changes-section li, .actions-section li {
    padding: 8px 0;
    border-bottom: 1px solid #F0EDE9;
    font-size: 14px;
    color: #4A4A4A;
}
.action-num {
    display: inline-block;
    width: 24px;
    height: 24px;
    background: #4F46E5;
    color: white;
    border-radius: 50%;
    text-align: center;
    line-height: 24px;
    font-size: 12px;
    margin-right: 10px;
}
.footer {
    text-align: center;
    color: #9A9A9A;
    font-size: 12px;
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid #E8E4DF;
}
.key-data { margin-bottom: 16px; }
.key-data td:first-child, .key-data td:nth-child(3) {
    color: #7A7A7A;
    font-size: 12px;
    width: 20%;
}
</style>
</head>
<body>

<div class="report-header">
    <div class="report-title">持仓深度分析报告</div>
    <div class="report-meta"> |  | 0只标的</div>
    <div class="summary-cards">
        <div class="summary-card">
            <div class="label">持仓总市值</div>
            <div class="value">$0</div>
        </div>
        <div class="summary-card">
            <div class="label">总浮盈亏</div>
            <div class="value" style="color:#4ade80">+$0</div>
        </div>
        <div class="summary-card">
            <div class="label">收益率</div>
            <div class="value" style="color:#4ade80">-0.6%</div>
        </div>
        <div class="summary-card">
            <div class="label">标的数</div>
            <div class="value">0</div>
        </div>
    </div>
</div>









<div class="footer">
    数据来源：老虎证券 OpenAPI + stock-data skill | 自动生成，仅供参考，不构成投资建议
</div>

</body>
</html>
